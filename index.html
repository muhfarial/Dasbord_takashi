                        <option value="Ayam & Daging Segar">Ayam & Daging Segar</option>
                        <option value="Bumbu & Tepung">Bumbu & Tepung</option>
                        <option value="Minyak Goreng">Minyak Goreng</option>
                        <option value="Saus & Topping">Saus & Topping</option>
                        <option value="Packaging & Kemasan">Packaging & Kemasan</option>
                      </select>

                      <select
                        value={statusFilter}
                        onChange={(e) => setStatusFilter(e.target.value)}
                        className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-700 outline-none"
                      >
                        <option value="ALL">Semua Status</option>
                        <option value="CRITICAL">Hanya Kritis (&lt; Safety)</option>
                        <option value="WARNING">Hanya Perhatian</option>
                        <option value="SAFE">Hanya Aman</option>
                      </select>
                    </div>

                    <button
                      onClick={() => {
                        const csv = "SKU,Nama,Stok,Satuan,Valuasi\n" + inventoryItems.map(i => `${i.sku},"${i.name}",${i.currentStock},${i.unit},${i.currentStock * i.standardCost}`).join("\n");
                        const blob = new Blob([csv], { type: 'text/csv' });
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `TFC_Inventory_${new Date().toISOString().slice(0,10)}.csv`;
                        a.click();
                        showToast("File CSV inventori berhasil diunduh.");
                      }}
                      className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center gap-2 transition shadow-sm"
                    >
                      <Icon name="download" className="w-3.5 h-3.5" />
                      <span>Export CSV</span>
                    </button>
                  </div>

                  {/* Main Inventory Table */}
                  <div className="bg-white rounded-2xl border border-slate-200/80 shadow-card-subtle overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50/80 border-b border-slate-200 text-slate-500 font-mono text-[11px]">
                          <tr>
                            <th className="py-3.5 px-4 font-bold">Kelas</th>
                            <th className="py-3.5 px-4 font-bold">SKU / Nama Item</th>
                            <th className="py-3.5 px-4 font-bold">Kategori</th>
                            <th className="py-3.5 px-4 text-right font-bold">Stok Aktual</th>
                            <th className="py-3.5 px-4 text-right font-bold">Safety Stock</th>
                            <th className="py-3.5 px-4 text-right font-bold">Valuasi (FIFO)</th>
                            <th className="py-3.5 px-4 text-center font-bold">Status</th>
                            <th className="py-3.5 px-4 text-center font-bold">Aksi Cepat</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredItems.map(item => {
                            let status = 'SAFE';
                            if (item.currentStock <= item.safetyStock * 0.75) status = 'CRITICAL';
                            else if (item.currentStock <= item.safetyStock) status = 'WARNING';

                            return (
                              <tr key={item.id} className="hover:bg-slate-50/80 transition-colors">
                                <td className="py-3.5 px-4 font-mono">
                                  <span className={`px-2.5 py-1 rounded-md font-semibold text-[10px] ${
                                    item.abcClass === 'A' 
                                      ? 'bg-red-100 text-red-800 border border-red-200' 
                                      : item.abcClass === 'B' 
                                      ? 'bg-amber-100 text-amber-800 border border-amber-200' 
                                      : 'bg-slate-100 text-slate-700 border border-slate-200'
                                  }`}>
                                    Kelas {item.abcClass}
                                  </span>
                                </td>
                                <td className="py-3.5 px-4">
                                  <div className="font-semibold text-slate-900">{item.name}</div>
                                  <div className="text-[11px] font-mono text-slate-400 mt-0.5">{item.sku}</div>
                                </td>
                                <td className="py-3.5 px-4 text-slate-600 font-medium">{item.category}</td>
                                <td className="py-3.5 px-4 text-right font-mono font-semibold text-sm text-slate-900">
                                  {item.currentStock} <span className="text-xs font-normal text-slate-500">{item.unit}</span>
                                </td>
                                <td className="py-3.5 px-4 text-right font-mono text-slate-500">
                                  {item.safetyStock} {item.unit}
                                </td>
                                <td className="py-3.5 px-4 text-right font-mono font-bold text-slate-800">
                                  {formatRp(item.currentStock * item.standardCost)}
                                </td>
                                <td className="py-3.5 px-4 text-center">
                                  <StatusPill status={status} />
                                </td>
                                <td className="py-3.5 px-4 text-center">
                                  <div className="flex items-center justify-center gap-1.5">
                                    <button
                                      onClick={() => {
                                        setCurrentScreen('SCR-04');
                                        setRecForm(prev => ({ ...prev, itemId: item.id }));
                                      }}
                                      className="px-2.5 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 rounded-lg text-xs font-bold border border-red-200 transition"
                                    >
                                      + Terima
                                    </button>
                                    <button
                                      onClick={() => {
                                        setPoForm(prev => ({ ...prev, itemId: item.id, qty: Math.max(10, Math.round(item.optimalStock - item.currentStock)) }));
                                        setCurrentScreen('SCR-09');
                                      }}
                                      className="px-2.5 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-xs font-bold border border-blue-200 transition"
                                    >
                                      + PO
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ============================================================ */}
              {/* SCR-04: GOODS RECEIVING */}
              {/* ============================================================ */}
              {currentScreen === 'SCR-04' && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle">
                    <div className="border-b border-slate-100 pb-3 mb-5">
                      <h3 className="text-base font-semibold text-slate-900">Form Penerimaan Barang & Cold Chain Gate</h3>
                      <p className="text-xs text-slate-500 mt-0.5">Validasi nomor LOT, tanggal kedaluwarsa (FEFO), dan suhu ketibaan.</p>
                    </div>

                    <form onSubmit={handleReceivingSubmit} className="space-y-4 text-xs">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Supplier Terdaftar *</label>
                          <select
                            value={recForm.supplier}
                            onChange={(e) => setRecForm({ ...recForm, supplier: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none"
                          >
                            <option value="PT Japfa Comfeed Indonesia Tbk">PT Japfa Comfeed Indonesia Tbk (Poultry)</option>
                            <option value="PT Charoen Pokphand Indonesia">PT Charoen Pokphand Indonesia (Poultry)</option>
                            <option value="PT Wilmar Nabati Indonesia">PT Wilmar Nabati Indonesia (Frying Fat)</option>
                            <option value="PT Indofood Sukses Makmur (Bogasari)">PT Indofood Bogasari (Flour)</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Nomor LOT / Batch Supplier *</label>
                          <input
                            type="text"
                            value={recForm.lot}
                            onChange={(e) => setRecForm({ ...recForm, lot: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono uppercase font-bold focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none"
                            required
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Item SKU *</label>
                          <select
                            value={recForm.itemId}
                            onChange={(e) => setRecForm({ ...recForm, itemId: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none"
                          >
                            {inventoryItems.map(i => (
                              <option key={i.id} value={i.id}>{i.sku} — {i.name}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Jumlah Diterima (Qty) *</label>
                          <input
                            type="number"
                            step="0.5"
                            value={recForm.qty}
                            onChange={(e) => setRecForm({ ...recForm, qty: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono font-semibold text-sm focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none"
                            required
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Tanggal Produksi *</label>
                          <input
                            type="date"
                            value={recForm.prodDate}
                            onChange={(e) => setRecForm({ ...recForm, prodDate: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono outline-none"
                            required
                          />
                        </div>

                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Tanggal Expired (FEFO) *</label>
                          <input
                            type="date"
                            value={recForm.expDate}
                            onChange={(e) => setRecForm({ ...recForm, expDate: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono outline-none"
                            required
                          />
                        </div>

                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Suhu Kedatangan (°C) *</label>
                          <input
                            type="number"
                            step="0.1"
                            value={recForm.tempArrival}
                            onChange={(e) => setRecForm({ ...recForm, tempArrival: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono font-bold text-red-600 outline-none"
                            required
                          />
                          <span className="text-[10px] text-slate-500 font-medium">Batas safe max: 4.0°C</span>
                        </div>
                      </div>

                      <div className="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                        <button
                          type="submit"
                          className="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-semibold shadow-xs transition"
                        >
                          Simpan & Masukkan ke Stok
                        </button>
                      </div>
                    </form>
                  </div>

                  <div className="bg-slate-900 text-slate-100 p-6 rounded-2xl shadow-xl border border-slate-800 space-y-4">
                    <div className="flex items-center gap-2 text-amber-400">
                      <Icon name="shield" className="w-5 h-5" />
                      <h4 className="text-sm font-bold font-medium font-mono">
                        Cold Chain Safety Gate
                      </h4>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Sesuai standar mutu franchise Takashi Fried Chicken, daging ayam karkas dan paha boneless wajib tiba di suhu <strong>1.0°C – 4.0°C</strong>.
                    </p>
                    <div className="p-3.5 bg-red-950/70 border border-red-800 rounded-xl text-xs text-red-200">
                      <strong>Aturan Reject Otomatis:</strong> Suhu &gt; 4.0°C memicu penolakan otomatis dan mewajibkan retur ke RPA/supplier.
                    </div>
                  </div>
                </div>
              )}

              {/* ============================================================ */}
              {/* SCR-05: KITCHEN CONSOLE & TIMERS */}
              {/* ============================================================ */}
              {currentScreen === 'SCR-05' && (
                <div className="space-y-6">
                  {/* Holding Cabinet Timers (KDS Visual) */}
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <div>
                        <h3 className="text-base font-semibold text-slate-900 flex items-center gap-2">
                          <Icon name="flame" className="w-5 h-5 text-red-600" />
                          <span>Holding Cabinet Horizon (Maksimal 90 Menit)</span>
                        </h3>
                        <p className="text-xs text-slate-500">Ayam goreng di warming cabinet wajib dibuang jika melebihi 90 menit.</p>
                      </div>
                      <button
                        onClick={handleAddCabinet}
                        className="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold shadow-xs"
                      >
                        + Batch Masuk Cabinet
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {holdingCabinets.map(cabinet => {
                        const remaining = Math.max(0, cabinet.maxMinutes - cabinet.elapsedMinutes);
                        const isExpired = remaining === 0;
                        const isWarning = remaining <= 15 && !isExpired;

                        return (
                          <div
                            key={cabinet.id}
                            className={`p-5 rounded-2xl border shadow-card-subtle transition-all duration-300 ${
                              isExpired 
                                ? 'bg-red-50/90 border-red-300 shadow-sm' 
                                : isWarning 
                                ? 'bg-amber-50/90 border-amber-300 shadow-sm' 
                                : 'bg-white border-slate-200'
                            }`}
                          >
                            <div className="flex items-center justify-between mb-2">
                              <span className="font-mono text-xs font-bold text-slate-600">{cabinet.code}</span>
                              <span className={`text-xs px-2 py-0.5 rounded font-mono font-medium ${
                                isExpired ? 'bg-red-600 text-white' : isWarning ? 'bg-amber-500 text-white' : 'bg-emerald-100 text-emerald-800'
                              }`}>
                                {isExpired ? 'KEDALUWARSA' : `Sisa ${remaining} Mnt`}
                              </span>
                            </div>
                            <h4 className="font-semibold text-sm text-slate-900">{cabinet.item}</h4>
                            <p className="text-xs text-slate-500 font-mono mt-0.5">
                              {cabinet.qty} Potong · {cabinet.station}
                            </p>

                            <div className="w-full bg-slate-200/80 rounded-full h-2.5 my-3.5 overflow-hidden">
                              <div
                                className={`h-2.5 rounded-full transition-all duration-500 ${isExpired ? 'bg-red-600' : isWarning ? 'bg-amber-500' : 'bg-emerald-600'}`}
                                style={{ width: `${Math.min(100, (cabinet.elapsedMinutes / 90) * 100)}%` }}
                              ></div>
                            </div>

                            <div className="flex justify-between items-center text-xs">
                              <span className="text-[11px] text-slate-400 font-mono">{cabinet.elapsedMinutes} mnt berlalu</span>
                              {isExpired ? (
                                <button
                                  onClick={() => handleDiscardCabinet(cabinet.id, cabinet.item)}
                                  className="px-3 py-1.5 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 text-xs shadow-xs"
                                >
                                  Buang (Log Waste)
                                </button>
                              ) : (
                                <button
                                  onClick={() => {
                                    setHoldingCabinets(prev => prev.filter(c => c.id !== cabinet.id));
                                    showToast("Batch disajikan ke kasir.");
                                  }}
                                  className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg font-bold text-xs"
                                >
                                  Sajikan
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Quick Usage Form & Log History */}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle">
                      <h4 className="text-sm font-semibold text-slate-900 mb-3">Catat Pemakaian / Pembuangan Cepat</h4>
                      <form onSubmit={handleKitchenLogSubmit} className="space-y-3.5 text-xs">
                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Tipe Log</label>
                          <div className="grid grid-cols-2 gap-2">
                            <button
                              type="button"
                              onClick={() => setQuickKitchen({ ...quickKitchen, type: 'SALES', reason: 'Penjualan Reguler' })}
                              className={`py-2.5 rounded-xl font-bold border transition ${
                                quickKitchen.type === 'SALES' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200'
                              }`}
                            >
                              Penjualan
                            </button>
                            <button
                              type="button"
                              onClick={() => setQuickKitchen({ ...quickKitchen, type: 'SPOILAGE', reason: 'BURNT_OVERCOOK' })}
                              className={`py-2.5 rounded-xl font-bold border transition ${
                                quickKitchen.type === 'SPOILAGE' ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-50 text-slate-700 border-slate-200'
                              }`}
                            >
                              Pembuangan / Waste
                            </button>
                          </div>
                        </div>

                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Item Bahan</label>
                          <select
                            value={quickKitchen.itemId}
                            onChange={(e) => setQuickKitchen({ ...quickKitchen, itemId: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                          >
                            {inventoryItems.map(i => (
                              <option key={i.id} value={i.id}>{i.name}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Jumlah (Qty)</label>
                          <input
                            type="number"
                            step="0.5"
                            value={quickKitchen.qty}
                            onChange={(e) => setQuickKitchen({ ...quickKitchen, qty: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono font-bold outline-none"
                            required
                          />
                        </div>

                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5">Keterangan / Alasan</label>
                          <select
                            value={quickKitchen.reason}
                            onChange={(e) => setQuickKitchen({ ...quickKitchen, reason: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                          >
                            {quickKitchen.type === 'SALES' ? (
                              <>
                                <option value="Penjualan Reguler">Penjualan Reguler</option>
                                <option value="Goreng Batch Siang">Goreng Batch Siang</option>
                              </>
                            ) : (
                              <>
                                <option value="BURNT_OVERCOOK">Gosong / Overcooked</option>
                                <option value="HOLDING_EXPIRED_90M">Holding Expired &gt; 90 Menit</option>
                                <option value="OVER_PORTION">Over-Portioning / Rusak</option>
                              </>
                            )}
                          </select>
                        </div>

                        <button
                          type="submit"
                          className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold transition mt-2 shadow-sm"
                        >
                          Simpan Catatan
                        </button>
                      </form>
                    </div>

                    <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle">
                      <h4 className="text-sm font-semibold text-slate-900 mb-3">Catatan Aktivitas Dapur Hari Ini</h4>
                      <div className="space-y-2">
                        {kitchenLogs.map(log => (
                          <div key={log.id} className="p-3.5 bg-slate-50/80 border border-slate-100 rounded-xl flex items-center justify-between text-xs">
                            <div className="flex items-center gap-3">
                              <span className="font-mono text-slate-400 font-semibold">{log.time}</span>
                              <div>
                                <span className="font-bold text-slate-900">{log.item}</span>
                                <p className="text-[11px] text-slate-500">{log.note} · {log.user}</p>
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className={`font-mono font-bold text-sm ${log.type === 'SALES' ? 'text-emerald-700' : 'text-red-600'}`}>
                                -{log.qty} {log.unit}
                              </span>
                              <span className={`text-[10px] font-medium px-2 py-0.5 rounded ${
                                log.type === 'SALES' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                              }`}>
                                {log.type}
                              </span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ============================================================ */}
              {/* SCR-06: INTER-BRANCH TRANSFER HUB */}
              {/* ============================================================ */}
              {currentScreen === 'SCR-06' && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle">
                    <h3 className="text-sm font-semibold text-slate-900 mb-1">Buat Permintaan Transfer Antar Cabang</h3>
                    <p className="text-xs text-slate-500 mb-4">
                      Aturan: Nilai transfer ≥ Rp 2.000.000 wajib disetujui Owner / HQ Supply Chain.
                    </p>

                    <form onSubmit={handleTransferSubmit} className="space-y-3.5 text-xs">
                      <div>
                        <label className="block text-slate-700 font-bold mb-1.5">Outlet Pengirim</label>
                        <select
                          value={transferForm.from}
                          onChange={(e) => setTransferForm({ ...transferForm, from: e.target.value })}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                        >
                          <option value="Central Plant">Central Processing Plant & Hub</option>
                          <option value="Takashi DayoDara">Takashi fried chicken DayoDara</option>
                          <option value="Takashi Zebra">Takashi fried chicken (Zebra)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1.5">Outlet Penerima</label>
                        <select
                          value={transferForm.to}
                          onChange={(e) => setTransferForm({ ...transferForm, to: e.target.value })}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                        >
                          <option value="Takashi DayoDara">Takashi fried chicken DayoDara</option>
                          <option value="Takashi Zebra">Takashi fried chicken (Zebra)</option>
                          <option value="Takashi Lapatta">Takashi Fried Chicken (Lapatta)</option>
                          <option value="Takashi Ngurah Rai">Takashi Fried Chicken (Ngurah Rai)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1.5">Item yang Ditransfer</label>
                        <select
                          value={transferForm.itemId}
                          onChange={(e) => setTransferForm({ ...transferForm, itemId: e.target.value })}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                        >
                          {inventoryItems.map(i => (
                            <option key={i.id} value={i.id}>{i.name} ({formatRp(i.standardCost)}/{i.unit})</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1.5">Jumlah (Qty)</label>
                        <input
                          type="number"
                          value={transferForm.qty}

                      <div className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-[11px]">
                        <div className="flex justify-between items-center">
                          <span className="text-slate-500 font-sans">Estimasi Valuasi:</span>
                          <span className="font-semibold text-sm text-slate-900">
                            {formatRp((inventoryItems.find(i => i.id === transferForm.itemId)?.standardCost || 50000) * transferForm.qty)}
                          </span>
                        </div>
                      </div>

                      <button
                        type="submit"

                      </button>
                    </form>
                  </div>

                  <div className="lg:col-span-2 space-y-3">

                      <div key={tr.id} className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-card-subtle text-xs space-y-3">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
                          <div className="flex items-center gap-2">
                            <span className="font-mono font-semibold text-slate-900">{tr.id}</span>
                            <span className="text-slate-400">•</span>
                            <span className="font-bold text-slate-700">{tr.fromOutlet} &rarr; {tr.toOutlet}</span>
                          </div>
                          <StatusPill
                            status={tr.status}
                            label={tr.status === 'WAITING_HQ_APPROVAL' ? 'Menunggu Approval HQ' : tr.status === 'IN_TRANSIT' ? 'Dalam Perjalanan' : 'Selesai Diterima'}

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 font-mono text-slate-600">
                          <div>
                            <span className="text-[10px] text-slate-400 block font-sans">Item:</span>
                            <span className="font-bold text-slate-800">{tr.item}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 block font-sans">Jumlah:</span>
                            <span className="font-bold text-slate-800">{tr.qty} {tr.unit}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 block font-sans">Total Valuasi:</span>
                            <span className="font-bold text-slate-900">{formatRp(tr.totalValuation)}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 block font-sans">Diminta oleh:</span>
                            <span className="text-slate-700 font-sans">{tr.requestedBy}</span>
                          </div>
                        </div>

                        {tr.status === 'WAITING_HQ_APPROVAL' && (
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pt-2.5 border-t border-slate-100 bg-amber-50/50 p-3 rounded-xl border border-amber-200/60">
                            <span className="text-amber-800 text-[11px] font-bold">
                              Nilai transfer ≥ {formatRp(configs.TRANSFER_HQ_THRESHOLD || 2000000)}. Memerlukan persetujuan OWNER (Sarah Wijaya).
                            </span>
                            <div className="flex gap-2">
                              <button
                                onClick={() => handleTransferAction(tr.id, 'approve')}
                                className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-xs shadow-xs"
                              >
                                Approve
                              </button>
                              <button
                                onClick={() => handleTransferAction(tr.id, 'reject')}
                                className="px-3 py-1.5 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg font-bold text-xs"
                              >
                                Reject
                              </button>
                            </div>
                          </div>
                        )}

                        {tr.status === 'IN_TRANSIT' && (
                          <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                            <span className="text-slate-500 text-[11px]">Sedang diantar armada kurir cold-chain TFC.</span>
                            <button
                              onClick={() => handleTransferAction(tr.id, 'complete')}
                              className="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-bold text-xs"
                            >
                              Konfirmasi Penerimaan (Acknowledge)
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ============================================================ */}
              {/* SCR-07: BATCH INSPECTOR & TPM SENSORS */}
              {/* ============================================================ */}
              {currentScreen === 'SCR-07' && (
                <div className="space-y-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                      <div>
                        <h3 className="text-sm font-semibold text-slate-900">
                          TPM Sensor Minyak Goreng (Total Polar Material — Maks {configs.TPM_MAX_THRESHOLD || 24.0}%)
                        </h3>
                        <p className="text-xs text-slate-500 mt-0.5">Minyak padat nabati deep fryer wajib diganti total saat TPM mencapai {configs.TPM_MAX_THRESHOLD || 24.0}%.</p>
                      </div>
                      <span className="text-xs font-mono font-bold bg-amber-100 text-amber-800 px-3 py-1 rounded-full border border-amber-200">
                        Sensor IoT Online
                      </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="p-5 bg-emerald-50/70 border border-emerald-200 rounded-2xl">
                        <div className="flex justify-between items-center text-xs text-emerald-800 font-bold mb-1">
                          <span>Fryer-01 (Nagoya)</span>
                          <span className="bg-emerald-100 px-2 py-0.5 rounded text-[10px]">Aman</span>
                        </div>
                        <div className="text-3xl font-semibold font-mono text-emerald-700 my-1.5">18.5%</div>
                        <p className="text-[11px] text-emerald-800 font-medium">Suhu: 178°C · Estimasi ganti: ~3 hari lagi</p>
                      </div>

                      <div className="p-5 bg-amber-50/70 border border-amber-200 rounded-2xl">
                        <div className="flex justify-between items-center text-xs text-amber-800 font-bold mb-1">
                          <span>Fryer-02 (Tokyo)</span>
                          <span className="bg-amber-100 px-2 py-0.5 rounded text-[10px]">Perhatian</span>
                        </div>
                        <div className="text-3xl font-semibold font-mono text-amber-700 my-1.5">21.2%</div>
                        <p className="text-[11px] text-amber-800 font-medium">Suhu: 182°C · Mendekati batas {configs.TPM_MAX_THRESHOLD || 24.0}%</p>
                      </div>

                      <div className="p-5 bg-red-50/70 border border-red-300 rounded-2xl ">
                        <div className="flex justify-between items-center text-xs text-red-800 font-bold mb-1">
                          <span>Fryer-03 (Osaka - DayoDara)</span>
                          <span className="bg-red-200 px-2 py-0.5 rounded text-[10px] font-semibold">Kritis</span>
                        </div>
                        <div className="text-3xl font-semibold font-mono text-red-700 my-1.5">25.1%</div>
                        <p className="text-[11px] text-red-800 font-bold">Wajib Drain & Ganti Minyak Baru Sekarang!</p>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-sm font-semibold text-slate-900">FEFO Batch Expiry Matrix (Live Database)</h3>
                      <span className="text-xs font-mono text-slate-500 font-semibold">{fefoBatches.length} Batch Aktif Terurut FEFO</span>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 border-b border-slate-200 font-mono text-[11px] text-slate-500">
                          <tr>
                            <th className="py-3 px-3">Nomor LOT</th>
                            <th className="py-3 px-3">Item</th>
                            <th className="py-3 px-3">Tgl Masuk</th>
                            <th className="py-3 px-3">Tgl Expired</th>
                            <th className="py-3 px-3 text-right">Sisa Qty</th>
                            <th className="py-3 px-3 text-center">Suhu Tiba</th>
                            <th className="py-3 px-3 text-center">Dwell Time</th>
                            <th className="py-3 px-3 text-center">Status FEFO</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 font-mono">
                          {fefoBatches.map(b => {
                            const isUrgent = b.status === 'EXPIRING_SOON_24H' || (b.dwell_hours && b.dwell_hours >= 36);
                            return (
                              <tr key={b.id || b.lot_number} className="hover:bg-slate-50/80">
                                <td className="py-3 px-3 font-bold text-slate-900">{b.lot_number}</td>
                                <td className="py-3 px-3 font-sans font-semibold text-slate-800">{b.item_name}</td>
                                <td className="py-3 px-3 text-slate-500">{b.prod_date}</td>
                                <td className={`py-3 px-3 font-bold ${isUrgent ? 'text-red-600' : 'text-emerald-700'}`}>{b.exp_date}</td>
                                <td className="py-3 px-3 text-right font-semibold text-slate-900">{b.remaining_qty} {b.unit}</td>
                                <td className="py-3 px-3 text-center">{b.arrival_temp !== null && b.arrival_temp !== undefined ? `${b.arrival_temp}°C` : '-'}</td>
                                <td className="py-3 px-3 text-center">{b.dwell_hours ? `${b.dwell_hours} Jam` : 'Dry'}</td>
                                <td className="py-3 px-3 text-center">
                                  <span className={`px-2.5 py-1 rounded-md font-bold text-[10px] ${
                                    isUrgent ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                                  }`}>
                                    {isUrgent ? 'PRIORITAS GORENG' : 'FRESH SAFE'}
                                  </span>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ============================================================ */}
              {/* SCR-08: MASTER DATA & THRESHOLDS CONFIG (PERSISTENT) */}
              {/* ============================================================ */}
              {currentScreen === 'SCR-08' && (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <form onSubmit={handleSaveConfigs} className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle space-y-4">
                    <div className="flex items-center justify-between border-b pb-2.5">
                      <h3 className="text-sm font-semibold text-slate-900">Konfigurasi Batas Threshold Operasional</h3>
                      <span className="text-[10px] font-mono font-medium bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200">
                        Persisten PDO
                      </span>
                    </div>
                    <div className="space-y-3.5 text-xs">
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Maksimal TPM Sensor Minyak Goreng (%)</label>
                        <input
                          type="number"
                          step="0.5"
                          value={configs.TPM_MAX_THRESHOLD}
                          onChange={(e) => setConfigs({ ...configs, TPM_MAX_THRESHOLD: parseFloat(e.target.value) || 24.0 })}
                          className="bg-slate-50 border border-slate-300 rounded-xl p-2.5 w-full font-mono font-bold outline-none focus:border-red-500"
                        />
                        <span className="text-[11px] text-slate-400">Nilai ≥ {configs.TPM_MAX_THRESHOLD}% memicu alarm wajib ganti shortening.</span>
                      </div>
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Batas Waktu Holding Cabinet (Menit)</label>
                        <input
                          type="number"
                          value={configs.HOLDING_CABINET_MAX_MINUTES}
                          onChange={(e) => setConfigs({ ...configs, HOLDING_CABINET_MAX_MINUTES: parseInt(e.target.value, 10) || 90 })}
                          className="bg-slate-50 border border-slate-300 rounded-xl p-2.5 w-full font-mono font-bold outline-none focus:border-red-500"
                        />
                        <span className="text-[11px] text-slate-400">Ayam lebih dari {configs.HOLDING_CABINET_MAX_MINUTES} menit wajib dibuang.</span>
                      </div>
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Threshold Nilai Transfer Wajib Approval HQ (Rp)</label>
                        <input
                          type="number"
                          step="100000"
                          value={configs.TRANSFER_HQ_THRESHOLD}
                          onChange={(e) => setConfigs({ ...configs, TRANSFER_HQ_THRESHOLD: parseInt(e.target.value, 10) || 2000000 })}
                          className="bg-slate-50 border border-slate-300 rounded-xl p-2.5 w-full font-mono font-bold outline-none focus:border-red-500"
                        />
                        <span className="text-[11px] text-slate-400">Transfer &lt; {formatRp(configs.TRANSFER_HQ_THRESHOLD || 2000000)} disetujui otomatis; ≥ membutuhkan verifikasi Owner.</span>
                      </div>
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Target Days Sales of Inventory (DSI) Ayam (Hari)</label>
                        <input
                          type="number"
                          step="0.1"
                          value={configs.TARGET_DSI_CHICKEN}
                          onChange={(e) => setConfigs({ ...configs, TARGET_DSI_CHICKEN: parseFloat(e.target.value) || 2.5 })}
                          className="bg-slate-50 border border-slate-300 rounded-xl p-2.5 w-full font-mono font-bold outline-none focus:border-red-500"
                        />
                        <span className="text-[11px] text-slate-400">Maksimal umur stok ayam segar di cabang sebelum diolah.</span>
                      </div>
                    </div>
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition shadow-sm"
                    >
                      Simpan Threshold Permanen
                    </button>
                  </form>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle space-y-4">
                    <div className="flex items-center justify-between border-b pb-2.5">
                      <h3 className="text-sm font-semibold text-slate-900">Daftar Cabang Resmi Takashi (Data Lokasi)</h3>
                      <span className="text-[11px] font-mono text-slate-500 font-semibold">4 Outlet Aktif + 1 Hub</span>
                    </div>
                    <div className="space-y-3">
                      {OUTLETS.filter(o => o.id !== 'all').map(outlet => (
                        <div key={outlet.id} className="p-4 bg-slate-50/80 rounded-2xl border border-slate-200 hover:border-red-300 transition-all flex flex-col justify-between text-xs">
                          <div className="flex items-start justify-between">
                            <div>
                              <h4 className="font-semibold text-sm text-slate-900">{outlet.name}</h4>
                              <span className="inline-block text-[11px] text-slate-500 font-medium mt-0.5">
                                {outlet.type === 'FAST_FOOD' ? 'Fast food' : outlet.type === 'CHICKEN' ? 'Chicken' : outlet.type === 'RESTAURANT' ? 'Restaurant' : 'Supply & Cold Storage'}
                              </span>
                              <p className="text-xs text-slate-700 mt-1 font-sans">{outlet.address}</p>
                            </div>
                            <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-mono rounded-full text-[10px] font-bold shrink-0 border border-emerald-200">
                              ONLINE
                            </span>
                          </div>
                          {outlet.hours && (
                            <div className="mt-2.5 pt-2 border-t border-slate-200/60 flex items-center gap-1.5 text-[11px] font-bold text-emerald-700">
                              <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                              <span>{outlet.hours}</span>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* ============================================================ */}
              {/* SCR-09: PURCHASE ORDER (PO) FORMAL — FULL CRUD & WORKFLOW */}
              {/* ============================================================ */}
              {currentScreen === 'SCR-09' && (() => {
                const selectedPoItem = inventoryItems.find(i => i.id === poForm.itemId);
                const poEstTotal = (selectedPoItem ? selectedPoItem.standardCost : 0) * (parseFloat(poForm.qty) || 0);
                const filteredPos = purchaseOrders.filter(p => poStatusFilter === 'ALL' || p.status === poStatusFilter);
                const totalPoValue = purchaseOrders.filter(p => p.status !== 'CANCELLED').reduce((acc, p) => acc + (p.totalCost || 0), 0);

                return (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <MetricCard title="Total Purchase Order" value={`${purchaseOrders.length} PO`} subtext="Tersimpan Permanen di Database" status="default" iconName="fileText" sparkline="CRUD Aktif" />
                      <MetricCard title="Menunggu Persetujuan HQ" value={`${pendingPoCount} PO`} subtext="Butuh Verifikasi Owner / Supply Chain" status={pendingPoCount > 0 ? 'warning' : 'success'} iconName="clock" sparkline="Approval" />
                      <MetricCard title="Total Nilai Pengadaan Aktif" value={formatRp(totalPoValue)} subtext="Akumulasi Belanja Bahan Baku" status="success" iconName="package" sparkline="EOQ Ready" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      {/* Form Buat PO Baru */}
                      <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle h-fit">
