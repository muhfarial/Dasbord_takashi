                        <p className="text-xs text-slate-500 mb-4 pb-3 border-b">Pengadaan resmi ke pemasok terverifikasi (RPA, Minyak, Bumbu).</p>

                        <form onSubmit={handleCreatePO} className="space-y-3.5 text-xs">
                          <div>
                            <label className="block text-slate-700 font-bold mb-1">Outlet Tujuan</label>
                            <select
                              value={poForm.outletId}
                              onChange={(e) => setPoForm({ ...poForm, outletId: e.target.value })}
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                            >
                              {OUTLETS.filter(o => o.id !== 'all').map(o => (
                                <option key={o.id} value={o.id}>{o.name}</option>
                              ))}
                            </select>
                          </div>

                          <div>
                            <label className="block text-slate-700 font-bold mb-1">Pemasok (Supplier Resmi)</label>
                            <select
                              value={poForm.supplierId}
                              onChange={(e) => setPoForm({ ...poForm, supplierId: e.target.value })}
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                            >
                              {suppliers.map(s => (
                                <option key={s.id} value={s.id}>{s.name} (Lead {s.lead_time_days}h · Rating {s.rating})</option>
                              ))}
                            </select>
                          </div>

                          <div>
                            <label className="block text-slate-700 font-bold mb-1">Item Bahan Baku (SKU)</label>
                            <select
                              value={poForm.itemId}
                              onChange={(e) => setPoForm({ ...poForm, itemId: e.target.value })}
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                            >
                              {inventoryItems.map(it => (
                                <option key={it.id} value={it.id}>
                                  [{it.abcClass}] {it.name} (Stok: {it.currentStock}/{it.safetyStock} {it.unit})
                                </option>
                              ))}
                            </select>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="block text-slate-700 font-bold mb-1">Kuantitas ({selectedPoItem?.unit || 'unit'})</label>
                              <input
                                type="number"
                                min="1"
                                step="1"
                                value={poForm.qty}
                                onChange={(e) => setPoForm({ ...poForm, qty: e.target.value })}
                                className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono font-bold outline-none"
                                required
                              />
                            </div>
                            <div>
                              <label className="block text-slate-700 font-bold mb-1">Estimasi Tiba</label>
                              <input
                                type="date"
                                value={poForm.expectedDate}
                                onChange={(e) => setPoForm({ ...poForm, expectedDate: e.target.value })}
                                className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono outline-none"
                                required
                              />
                            </div>
                          </div>

                          <div>
                            <label className="block text-slate-700 font-bold mb-1">Catatan Pengadaan</label>
                            <input
                              type="text"
                              value={poForm.notes}
                              onChange={(e) => setPoForm({ ...poForm, notes: e.target.value })}
                              placeholder="Misal: Persiapan lonjakan weekend +350%"
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                            />
                          </div>

                          <div className="p-3.5 rounded-xl bg-slate-900 text-white flex items-center justify-between">
                            <div>
                              <span className="text-[10px] text-slate-400 uppercase block">Total Estimasi PO</span>
                              <span className="text-base font-semibold font-mono">{formatRp(poEstTotal)}</span>
                            </div>
                            <span className="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-1 rounded-lg font-bold">
                              Harga Standar FIFO
                            </span>
                          </div>

                          <button
                            type="submit"
                            className="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-semibold shadow-xs transition"
                          >
                            Terbitkan Purchase Order (PO)
                          </button>
                        </form>
                      </div>

                      {/* Daftar & Alur Kerja PO */}
                      <div className="lg:col-span-2 space-y-4">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <h3 className="text-sm font-semibold text-slate-900">Daftar Purchase Order & Alur Persetujuan</h3>
                          <div className="flex flex-wrap gap-1.5 text-[11px]">
                            {['ALL', 'SUBMITTED', 'APPROVED_HQ', 'ORDERED', 'RECEIVED'].map(st => (
                              <button
                                key={st}
                                onClick={() => setPoStatusFilter(st)}
                                className={`px-2.5 py-1 rounded-lg font-bold transition ${
                                  poStatusFilter === st ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
                                }`}
                              >
                                {st === 'ALL' ? 'Semua' : st}
                              </button>
                            ))}
                          </div>
                        </div>

                        {filteredPos.map(po => (
                          <div key={po.id} className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-card-subtle text-xs space-y-3">
                            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
                              <div className="flex items-center gap-2">
                                <span className="font-mono font-semibold text-slate-900">{po.poNumber}</span>
                                <span className="text-slate-300">•</span>
                                <span className="font-bold text-slate-700">{po.supplierName}</span>
                              </div>
                              <StatusPill
                                status={po.status === 'SUBMITTED' ? 'WARNING' : po.status === 'CANCELLED' ? 'CRITICAL' : 'SAFE'}
                                label={po.status}
                              />
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-slate-600">
                              <div>
                                <span className="text-[10px] text-slate-400 block">Item & Outlet:</span>
                                <span className="font-bold text-slate-900 block">{po.itemName}</span>
                                <span className="text-[11px] text-slate-500">{po.outletName}</span>
                              </div>
                              <div>
                                <span className="text-[10px] text-slate-400 block">Kuantitas:</span>
                                <span className="font-mono font-bold text-slate-900">{po.qty} {po.unit}</span>
                              </div>
                              <div>
                                <span className="text-[10px] text-slate-400 block">Total Nilai PO:</span>
                                <span className="font-mono font-semibold text-slate-900">{formatRp(po.totalCost)}</span>
                              </div>
                              <div>
                                <span className="text-[10px] text-slate-400 block">Estimasi Tiba / Pemohon:</span>
                                <span className="font-mono text-slate-800 block">{po.expectedDate}</span>
                                <span className="text-[11px] text-slate-500">{po.requestedBy}</span>
                              </div>
                            </div>

                            {po.notes && (
                              <p className="text-[11px] text-slate-500 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                Catatan: {po.notes}
                              </p>
                            )}

                            <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
                              <span className="text-[11px] text-slate-400">
                                Dibuat: {po.createdAt} {po.approvedBy ? `· Disetujui oleh ${po.approvedBy}` : ''}
                              </span>
                              <div className="flex flex-wrap gap-2">
                                {po.status === 'SUBMITTED' && (
                                  <>
                                    <button
                                      onClick={() => handleUpdatePOStatus(po.id, 'APPROVED_HQ')}
                                      className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-xs"
                                    >
                                      Setujui PO (HQ/Owner)
                                    </button>
                                    <button
                                      onClick={() => handleUpdatePOStatus(po.id, 'CANCELLED')}
                                      className="px-3 py-1.5 bg-red-50 text-red-700 hover:bg-red-100 rounded-lg font-bold text-xs"
                                    >
                                      Batalkan
                                    </button>
                                  </>
                                )}
                                {po.status === 'APPROVED_HQ' && (
                                  <button
                                    onClick={() => handleUpdatePOStatus(po.id, 'ORDERED')}
                                    className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-xs"
                                  >
                                    Kirim ke Supplier (ORDERED)
                                  </button>
                                )}
                                {po.status === 'ORDERED' && (
                                  <button
                                    onClick={() => handleUpdatePOStatus(po.id, 'RECEIVED')}
                                    className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-bold text-xs"
                                  >
                                    Tandai Diterima (+ Tambah Stok)
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* ============================================================ */}
              {/* SCR-10: STOCK OPNAME FORMAL — AUDIT FISIK & TOLERANSI 3%-5% */}
              {/* ============================================================ */}
              {currentScreen === 'SCR-10' && (() => {
                const selectedOpItem = inventoryItems.find(i => i.id === opnameForm.itemId);
                const sysStock = selectedOpItem ? selectedOpItem.currentStock : 0;
                const phyStock = parseFloat(opnameForm.physicalStock) || 0;
                const previewDiffQty = Number((phyStock - sysStock).toFixed(2));
                const previewDiffPct = sysStock > 0 ? Number(((previewDiffQty / sysStock) * 100).toFixed(2)) : 0;
                const previewAbsPct = Math.abs(previewDiffPct);
                const previewDiffVal = previewDiffQty * (selectedOpItem ? selectedOpItem.standardCost : 0);
                const previewStatus = previewAbsPct > 5 ? 'AUDIT_ALERT_GT_5_PCT' : previewAbsPct > 3 ? 'WARNING_3_5_PCT' : 'NORMAL';

                const exportOpnameCsv = () => {
                  const csv = "Opname_Number,Outlet,Item,System_Stock,Physical_Stock,Selisih_Qty,Selisih_Pct,Nilai_Selisih_Rp,Status_Toleransi,Auditor,Waktu\n"
                    + stockOpnames.map(o => `${o.opnameNumber},"${o.outletName}","${o.itemName}",${o.systemStock},${o.physicalStock},${o.discrepancyQty},${o.discrepancyPct}%,${o.discrepancyValue},${o.toleranceStatus},"${o.auditedBy}","${o.auditedAt}"`).join("\n");
                  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `TFC_Stock_Opname_${new Date().toISOString().slice(0,10)}.csv`;
                  a.click();
                  showToast('Laporan Audit Stock Opname (CSV) berhasil diunduh.');
                };

                return (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <MetricCard title="Total Audit Opname" value={`${stockOpnames.length} Sesi`} subtext="Tercatat Permanen di Database" status="default" iconName="clipboard" sparkline="Audit Trail" />
                      <MetricCard title="Alert Selisih (> 5%)" value={`${opnameAlertCount} Kasus`} subtext="Melewati Batas Toleransi Alami PRD" status={opnameAlertCount > 0 ? 'critical' : 'success'} iconName="alert" sparkline="Investigasi" />
                      <MetricCard title="Batas Toleransi Susut PRD" value="3% – 5%" subtext="Normal ≤3% · Warning 3-5% · Alert >5%" status="success" iconName="shield" sparkline="SOP TFC" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      {/* Form Audit Stock Opname */}
                      <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle h-fit">
                        <h3 className="text-sm font-semibold text-slate-900 mb-1">Input Audit Stock Opname Harian</h3>
                        <p className="text-xs text-slate-500 mb-4 pb-3 border-b">Bandingkan stok buku sistem dengan hasil hitung fisik di gudang/chiller.</p>

                        <form onSubmit={handleCreateOpname} className="space-y-3.5 text-xs">
                          <div>
                            <label className="block text-slate-700 font-bold mb-1">Outlet Diaudit</label>
                            <select
                              value={opnameForm.outletId}
                              onChange={(e) => setOpnameForm({ ...opnameForm, outletId: e.target.value })}
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                            >
                              {OUTLETS.filter(o => o.id !== 'all').map(o => (
                                <option key={o.id} value={o.id}>{o.name}</option>
                              ))}
                            </select>
                          </div>

                          <div>
                            <label className="block text-slate-700 font-bold mb-1">Item Bahan Baku</label>
                            <select
                              value={opnameForm.itemId}
                              onChange={(e) => {
                                const it = inventoryItems.find(x => x.id === e.target.value);
                                setOpnameForm({ ...opnameForm, itemId: e.target.value, physicalStock: it ? it.currentStock : 0 });
                              }}
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                            >
                              {inventoryItems.map(it => (
                                <option key={it.id} value={it.id}>{it.sku} — {it.name}</option>
                              ))}
                            </select>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="block text-slate-500 font-bold mb-1">Stok Sistem</label>
                              <div className="w-full bg-slate-100 border border-slate-200 rounded-xl p-2.5 font-mono font-semibold text-slate-800">
                                {sysStock} {selectedOpItem?.unit}
                              </div>
                            </div>
                            <div>
                              <label className="block text-slate-700 font-bold mb-1">Stok Fisik Aktual *</label>
                              <input
                                type="number"
                                step="0.5"
                                min="0"
                                value={opnameForm.physicalStock}
                                onChange={(e) => setOpnameForm({ ...opnameForm, physicalStock: e.target.value })}
                                className="w-full bg-white border-2 border-slate-300 focus:border-red-500 rounded-xl p-2.5 font-mono font-semibold outline-none"
                                required
                              />
                            </div>
                          </div>

                          {/* Live Discrepancy Preview */}
                          <div className={`p-3.5 rounded-xl border ${
                            previewStatus === 'AUDIT_ALERT_GT_5_PCT'
                              ? 'bg-red-50 border-red-300 text-red-900'
                              : previewStatus === 'WARNING_3_5_PCT'
                                ? 'bg-amber-50 border-amber-300 text-amber-900'
                                : 'bg-emerald-50 border-emerald-200 text-emerald-900'
                          }`}>
                            <div className="flex items-center justify-between mb-1">
                              <span className="font-bold text-[11px]">Simulasi Selisih (Discrepancy):</span>
                              <span className="font-mono font-semibold text-xs">{previewDiffQty > 0 ? `+${previewDiffQty}` : previewDiffQty} {selectedOpItem?.unit} ({previewDiffPct}%)</span>
                            </div>
                            <div className="flex items-center justify-between text-[11px]">
                              <span>Dampak Finansial: <strong className="font-mono">{formatRp(previewDiffVal)}</strong></span>
                              <span className="font-semibold uppercase text-[10px]">
                                {previewStatus === 'AUDIT_ALERT_GT_5_PCT' ? 'Alert > 5%' : previewStatus === 'WARNING_3_5_PCT' ? 'Warning 3-5%' : 'Normal ≤ 3%'}
                              </span>
                            </div>
                          </div>

                          <label className="flex items-center gap-2 cursor-pointer select-none py-1">
                            <input
                              type="checkbox"
                              checked={opnameForm.adjustStock}
                              onChange={(e) => setOpnameForm({ ...opnameForm, adjustStock: e.target.checked })}
                              className="rounded text-red-600 w-4 h-4"
                            />
                            <span className="font-semibold text-slate-700">Sesuaikan stok sistem mengikuti hasil fisik aktual</span>
                          </label>

                          <div>
                            <label className="block text-slate-700 font-bold mb-1">Catatan Audit / Penyebab Selisih</label>
                            <textarea
                              rows="2"
                              value={opnameForm.notes}
                              onChange={(e) => setOpnameForm({ ...opnameForm, notes: e.target.value })}
                              placeholder="Wajib isi keterangan investigasi bila selisih > 5%..."
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none"
                              required={previewStatus === 'AUDIT_ALERT_GT_5_PCT'}
                            ></textarea>
                          </div>

                          <button
                            type="submit"
                            className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold shadow-md transition"
                          >
                            Simpan Berita Acara Stock Opname
                          </button>
                        </form>
                      </div>

                      {/* Tabel Riwayat Audit Stock Opname */}
                      <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-card-subtle">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                          <div>
                            <h3 className="text-sm font-semibold text-slate-900">Riwayat Audit Stock Opname Formal</h3>
                            <p className="text-xs text-slate-500">Jejak audit selisih fisik vs sistem beserta penyesuaian stok.</p>
                          </div>
                          <button
                            onClick={exportOpnameCsv}
                            className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center gap-1.5"
                          >
                            <Icon name="download" className="w-3.5 h-3.5" />
                            <span>Export CSV Opname</span>
                          </button>
                        </div>

                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead className="bg-slate-50 border-b border-slate-200 font-mono text-[11px] text-slate-500">
                              <tr>
                                <th className="py-3 px-3">No. Opname</th>
                                <th className="py-3 px-3">Item & Cabang</th>
                                <th className="py-3 px-3 text-right">Sistem vs Fisik</th>
                                <th className="py-3 px-3 text-right">Selisih (%)</th>
                                <th className="py-3 px-3 text-center">Status Toleransi</th>
                                <th className="py-3 px-3">Auditor & Catatan</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {stockOpnames.map(op => (
                                <tr key={op.id} className="hover:bg-slate-50/80">
                                  <td className="py-3 px-3 font-mono font-bold text-slate-900">
                                    {op.opnameNumber}
                                    <span className="block text-[10px] text-slate-400 font-normal">{op.auditedAt}</span>
                                  </td>
                                  <td className="py-3 px-3">
                                    <span className="font-bold text-slate-900 block">{op.itemName}</span>
                                    <span className="text-[11px] text-slate-500">{op.outletName}</span>
                                  </td>
                                  <td className="py-3 px-3 text-right font-mono">
                                    <span className="text-slate-500">{op.systemStock}</span> &rarr; <strong className="text-slate-900">{op.physicalStock}</strong> {op.unit}
                                  </td>
                                  <td className={`py-3 px-3 text-right font-mono font-semibold ${
                                    op.toleranceStatus === 'AUDIT_ALERT_GT_5_PCT' ? 'text-red-600' : op.toleranceStatus === 'WARNING_3_5_PCT' ? 'text-amber-600' : 'text-emerald-700'
                                  }`}>
                                    {op.discrepancyQty > 0 ? `+${op.discrepancyQty}` : op.discrepancyQty} ({op.discrepancyPct}%)
                                    <span className="block text-[10px] font-semibold text-slate-500">{formatRp(op.discrepancyValue)}</span>
                                  </td>
                                  <td className="py-3 px-3 text-center">
                                    <StatusPill
                                      status={op.toleranceStatus === 'AUDIT_ALERT_GT_5_PCT' ? 'CRITICAL' : op.toleranceStatus === 'WARNING_3_5_PCT' ? 'WARNING' : 'SAFE'}
                                      label={op.toleranceStatus === 'AUDIT_ALERT_GT_5_PCT' ? 'ALERT > 5%' : op.toleranceStatus === 'WARNING_3_5_PCT' ? 'WARN 3-5%' : 'NORMAL ≤ 3%'}
                                    />
                                  </td>
                                  <td className="py-3 px-3 max-w-[200px]">
                                    <span className="font-bold text-slate-800 block">{op.auditedBy}</span>
                                    <span className="text-[11px] text-slate-500 line-clamp-2">{op.notes || '-'}</span>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })()}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
