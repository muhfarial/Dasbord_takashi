    // Smart REST API Helper (supports http://127.0.0.1:8000, Laragon subdirectory, and file:// graceful fallback)
    const getApiBase = () => {
      if (window.location.protocol === 'file:') return null;
      const cleanPath = window.location.pathname.replace(/\/(index\.(html|php))?$/, '');
      return (cleanPath === '' || cleanPath === '/') ? '/api' : `${cleanPath}/api`;
    };

    const apiRequest = async (endpoint, options = {}) => {
      const base = getApiBase();
      if (!base) return { offline: true };
      try {
        const res = await fetch(`${base}${endpoint}`, {
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          ...options
        });
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok, httpStatus: res.status, data };
      } catch (err) {
        return { offline: true, error: err };
      }
    };

        e.preventDefault();
        const temp = parseFloat(recForm.tempArrival);
        const qtyNum = parseFloat(recForm.qty);

        const res = await apiRequest('/receiving', {
          method: 'POST',
          body: JSON.stringify({
            ...recForm,
            qty: qtyNum,
            tempArrival: temp,
            receivedBy: currentUser?.name || 'Chef Danu Prasetyo'
          })
        });

        if (!res.offline) {
          if (res.ok && res.data?.status === 'success') {
            applyServerState(res.data.state);
            showToast(`${res.data.message}`);
            setRecForm(prev => ({
              ...prev,
              lot: `LOT-20261118-${Math.floor(Math.random() * 899 + 100)}`
            }));
          } else {
            showToast(`${res.data?.message || 'Penerimaan ditolak oleh server.'}`, 'error');
          }
          return;
        }

        // Offline fallback
        if (temp > 4.0 && (recForm.itemId === 'item-01' || recForm.itemId === 'item-02' || recForm.itemId === 'item-03')) {
          showToast(`Penerimaan ditolak: Suhu tiba ${temp}°C > 4.0°C! Batch ditolak demi food safety!`, 'error');
          return;
        }
        const target = inventoryItems.find(i => i.id === recForm.itemId);
        setInventoryItems(prev => prev.map(item => item.id === recForm.itemId ? { ...item, currentStock: item.currentStock + qtyNum } : item));
        setFefoBatches(prev => [{
          id: `btc-${Date.now()}`, lot_number: recForm.lot, item_name: target?.name || 'Item',
          prod_date: recForm.prodDate, exp_date: recForm.expDate, remaining_qty: qtyNum,
          unit: target?.unit || 'unit', dwell_hours: 1, arrival_temp: temp, status: 'ACTIVE_FRESH'
        }, ...prev]);
        showToast(`Sukses terima batch ${recForm.lot} (+${qtyNum} unit). FEFO terdaftar.`);
        setRecForm(prev => ({ ...prev, lot: `LOT-20261118-${Math.floor(Math.random() * 899 + 100)}` }));
      };

      // Transfer submission (Persisted to PDO API)
      const handleTransferSubmit = async (e) => {
        e.preventDefault();
        const qty = parseFloat(transferForm.qty);

        const res = await apiRequest('/transfers', {
          method: 'POST',
          body: JSON.stringify({
            ...transferForm,
            qty,
            requestedBy: currentUser?.name || 'Staff'
          })
        });

        if (!res.offline) {
          if (res.ok && res.data?.status === 'success') {
            applyServerState(res.data.state);
            showToast(res.data.requiresHqApproval ? `${res.data.message}` : `${res.data.message}`, res.data.requiresHqApproval ? 'warning' : 'success');
          } else {
            showToast(`${res.data?.message || 'Gagal membuat transfer.'}`, 'error');
          }
          return;
        }

        const selectedItem = inventoryItems.find(i => i.id === transferForm.itemId);
        const valuation = (selectedItem ? selectedItem.standardCost : 50000) * qty;
        const requiresHq = valuation >= (configs.TRANSFER_HQ_THRESHOLD || 2000000);
        const newTr = {
          id: `TR-2026-${Math.floor(Math.random() * 899 + 100)}`,
          fromOutlet: transferForm.from,
          toOutlet: transferForm.to,
          item: selectedItem ? selectedItem.name : 'Item TFC',
          qty,
          unit: selectedItem ? selectedItem.unit : 'unit',
          totalValuation: valuation,
          requiresHqApproval: requiresHq,
          status: requiresHq ? 'WAITING_HQ_APPROVAL' : 'IN_TRANSIT',
          requestedBy: currentUser?.name || 'Staff',
          createdAt: 'Baru saja'
        };
        setTransfers([newTr, ...transfers]);
        showToast(requiresHq ? `Nilai transfer ${formatRp(valuation)} ≥ threshold HQ. Menunggu Approval Owner!` : `✓ Transfer ${formatRp(valuation)} disetujui otomatis. Status: IN-TRANSIT.`);
      };

      // Transfer Approve / Reject / Complete (Persisted + RBAC Enforced)
      const handleTransferAction = async (trId, action) => {
        const res = await apiRequest(`/transfers/${encodeURIComponent(trId)}/${action}`, {
          method: 'PUT',
          body: JSON.stringify({ role: currentUser?.role || '', actor: currentUser?.name || '' })
        });

        if (!res.offline) {
          if (res.ok && res.data?.status === 'success') {
            applyServerState(res.data.state);
            showToast(`${res.data.message}`);
          } else {
            showToast(`${res.data?.message || 'Aksi transfer ditolak.'}`, 'error');
          }
          return;
        }

        if ((action === 'approve' || action === 'reject') && currentUser?.role !== 'OWNER') {
          showToast('Persetujuan transfer ≥ Rp 2.000.000 hanya dapat dilakukan oleh akun Owner.', 'error');
          return;
        }
        const statusMap = { approve: 'IN_TRANSIT', reject: 'REJECTED', complete: 'COMPLETED' };
        setTransfers(prev => prev.map(t => t.id === trId ? { ...t, status: statusMap[action] } : t));
        showToast(`Status transfer ${trId} diperbarui menjadi ${statusMap[action]}.`);
      };

      // Kitchen Log (Persisted to PDO API)
      const handleKitchenLogSubmit = async (e) => {
        e.preventDefault();
        const qtyNum = parseFloat(quickKitchen.qty);

        const res = await apiRequest('/kitchen-logs', {
          method: 'POST',
          body: JSON.stringify({
            ...quickKitchen,
            qty: qtyNum,
            user: currentUser?.name || 'Agus Koki'
          })
        });

        if (!res.offline) {
          if (res.ok && res.data?.status === 'success') {
            applyServerState(res.data.state);
            showToast(`${res.data.message}`);
          } else {
            showToast(`${res.data?.message || 'Gagal mencatat log dapur.'}`, 'error');
          }
          return;
        }

        const targetItem = inventoryItems.find(i => i.id === quickKitchen.itemId);
        setInventoryItems(prev => prev.map(item => item.id === quickKitchen.itemId ? { ...item, currentStock: Math.max(0, item.currentStock - qtyNum) } : item));
        const newLog = {
          id: `k-${Date.now()}`,
          time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
          item: targetItem ? targetItem.name : 'Item',
          type: quickKitchen.type,
          qty: qtyNum,
          unit: targetItem ? targetItem.unit : 'kg',
          note: quickKitchen.reason,
          user: currentUser?.name || 'Staff'
        };
        setKitchenLogs([newLog, ...kitchenLogs]);
        showToast(`Catatan dapur tersimpan: -${qtyNum} ${targetItem?.unit || 'unit'}`);
      };

      // Add Holding Cabinet Batch (Persisted to PDO API)
      const handleAddCabinet = async (e) => {
        e.preventDefault();
        const res = await apiRequest('/holding-cabinets', {
          method: 'POST',
          body: JSON.stringify({ ...newCabinetForm, qty: parseInt(newCabinetForm.qty, 10) || 18 })
        });
        if (!res.offline && res.ok && res.data?.status === 'success') {
          applyServerState(res.data.state);
          showToast(`${res.data.message}`);
          return;
        }
        const newCab = {
          id: `hc-${Date.now()}`,
          code: `BATCH-HC-${Math.floor(Math.random() * 500 + 400)}`,
          item: newCabinetForm.item,
          qty: parseInt(newCabinetForm.qty, 10) || 18,
          station: newCabinetForm.station,
          elapsedMinutes: 0,
          maxMinutes: configs.HOLDING_CABINET_MAX_MINUTES || 90
        };
        setHoldingCabinets(prev => [newCab, ...prev]);
        showToast(`Batch ${newCab.code} masuk Holding Cabinet.`);
      };

      // Discard Holding Cabinet Batch (Persisted + Auto Spoilage Log)
      const handleDiscardCabinet = async (id, itemName) => {
        const res = await apiRequest(`/holding-cabinets/${encodeURIComponent(id)}/discard`, {
          method: 'POST',
          body: JSON.stringify({ user: currentUser?.name || 'Agus Koki' })
        });
        if (!res.offline && res.ok && res.data?.status === 'success') {
          applyServerState(res.data.state);
          showToast(`${res.data.message}`, 'warning');
          return;
        }
        setHoldingCabinets(prev => prev.filter(c => c.id !== id));
        showToast(`Batch ${itemName} dibuang (Waste logged).`, 'warning');
      };

      // Purchase Order CRUD (SCR-09)
      const handleCreatePO = async (e) => {
        e.preventDefault();
        const outlet = OUTLETS.find(o => o.id === poForm.outletId);
        const supplier = suppliers.find(s => s.id === poForm.supplierId);
        const item = inventoryItems.find(i => i.id === poForm.itemId);
        const qtyNum = parseFloat(poForm.qty);

        const res = await apiRequest('/purchase-orders', {
          method: 'POST',
          body: JSON.stringify({
            ...poForm,
            qty: qtyNum,
            outletName: outlet?.name || 'Takashi fried chicken DayoDara',
            supplierName: supplier?.name || 'PT Japfa Comfeed Indonesia Tbk',
            requestedBy: currentUser?.name || 'Staff'
          })
        });

        if (!res.offline) {
          if (res.ok && res.data?.status === 'success') {
            applyServerState(res.data.state);
            showToast(`${res.data.message}`);
            setPoForm(prev => ({ ...prev, notes: '' }));
          } else {
            showToast(`${res.data?.message || 'Gagal membuat PO.'}`, 'error');
          }
          return;
        }

        const newPo = {
          id: `po-${Date.now()}`,
          poNumber: `PO-20261118-${Math.floor(Math.random() * 899 + 100)}`,
          outletId: poForm.outletId,
          outletName: outlet?.name || 'Takashi DayoDara',
          supplierId: poForm.supplierId,
          supplierName: supplier?.name || 'Supplier',
          itemId: poForm.itemId,
          itemName: item?.name || 'Item',
          qty: qtyNum,
          unit: item?.unit || 'unit',
          unitCost: item?.standardCost || 0,
          totalCost: (item?.standardCost || 0) * qtyNum,
          expectedDate: poForm.expectedDate,
          status: 'SUBMITTED',
          requestedBy: currentUser?.name || 'Staff',
          approvedBy: null,
          notes: poForm.notes,
          createdAt: 'Baru saja'
        };
        setPurchaseOrders(prev => [newPo, ...prev]);
        showToast(`PO ${newPo.poNumber} berhasil dibuat.`);
        setPoForm(prev => ({ ...prev, notes: '' }));
      };

      const handleUpdatePOStatus = async (poId, newStatus) => {
        const res = await apiRequest(`/purchase-orders/${encodeURIComponent(poId)}/status`, {
          method: 'PUT',
          body: JSON.stringify({
            status: newStatus,
            actor: currentUser?.name || 'Staff',
            role: currentUser?.role || ''
          })
        });

        if (!res.offline) {
          if (res.ok && res.data?.status === 'success') {
            applyServerState(res.data.state);
            showToast(`${res.data.message}`);
          } else {
            showToast(`${res.data?.message || 'Gagal mengubah status PO.'}`, 'error');
          }
          return;
        }

        if (newStatus === 'APPROVED_HQ' && currentUser?.role !== 'OWNER' && currentUser?.role !== 'HQ_SUPPLY_CHAIN') {
          showToast('Hanya OWNER atau HQ_SUPPLY_CHAIN yang dapat menyetujui PO.', 'error');
          return;
        }
        const targetPo = purchaseOrders.find(p => p.id === poId);
        setPurchaseOrders(prev => prev.map(p => p.id === poId ? { ...p, status: newStatus, approvedBy: newStatus === 'APPROVED_HQ' ? currentUser?.name : p.approvedBy } : p));
        if (newStatus === 'RECEIVED' && targetPo && targetPo.status !== 'RECEIVED') {
          setInventoryItems(prev => prev.map(it => it.id === targetPo.itemId ? { ...it, currentStock: it.currentStock + targetPo.qty } : it));
        }
        showToast(`Status PO diperbarui ke ${newStatus}.`);
      };

      // Stock Opname CRUD (SCR-10)
      const handleCreateOpname = async (e) => {
        e.preventDefault();
        const outlet = OUTLETS.find(o => o.id === opnameForm.outletId);
        const item = inventoryItems.find(i => i.id === opnameForm.itemId);
        const physical = parseFloat(opnameForm.physicalStock);

        const res = await apiRequest('/stock-opnames', {
          method: 'POST',
          body: JSON.stringify({
            ...opnameForm,
            physicalStock: physical,
            outletName: outlet?.name || 'Takashi fried chicken DayoDara',
            auditedBy: currentUser?.name || 'Chef Danu Prasetyo'
          })
        });

        if (!res.offline) {
          if (res.ok && res.data?.status === 'success') {
            applyServerState(res.data.state);
            showToast(res.data.toleranceStatus === 'AUDIT_ALERT_GT_5_PCT' ? `${res.data.message}` : `${res.data.message}`, res.data.toleranceStatus === 'AUDIT_ALERT_GT_5_PCT' ? 'warning' : 'success');
            setOpnameForm(prev => ({ ...prev, notes: '' }));
          } else {
            showToast(`${res.data?.message || 'Gagal menyimpan Stock Opname.'}`, 'error');
          }
          return;
        }

        const sys = item?.currentStock || 0;
        const discQty = Number((physical - sys).toFixed(2));
        const discPct = sys > 0 ? Number(((discQty / sys) * 100).toFixed(2)) : 0;
        const absPct = Math.abs(discPct);
        const tol = absPct > 5 ? 'AUDIT_ALERT_GT_5_PCT' : absPct > 3 ? 'WARNING_3_5_PCT' : 'NORMAL';
        const newOp = {
          id: `opn-${Date.now()}`,
          opnameNumber: `OPN-20261118-${Math.floor(Math.random() * 899 + 100)}`,
          outletId: opnameForm.outletId,
          outletName: outlet?.name || 'Takashi DayoDara',
          itemId: opnameForm.itemId,
          itemName: item?.name || 'Item',
          unit: item?.unit || 'unit',
          systemStock: sys,
          physicalStock: physical,
          discrepancyQty: discQty,
          discrepancyPct: discPct,
          discrepancyValue: discQty * (item?.standardCost || 0),
          toleranceStatus: tol,
          stockAdjusted: opnameForm.adjustStock,
          auditedBy: currentUser?.name || 'Staff',
          notes: opnameForm.notes,
          auditedAt: 'Baru saja'
        };
        setStockOpnames(prev => [newOp, ...prev]);
        if (opnameForm.adjustStock) {
          setInventoryItems(prev => prev.map(it => it.id === opnameForm.itemId ? { ...it, currentStock: Math.max(0, physical) } : it));
        }
        showToast(`Opname ${newOp.opnameNumber} tersimpan (${discPct}%).`);
        setOpnameForm(prev => ({ ...prev, notes: '' }));
      };

      // Save Threshold Configs (SCR-08 Persisted to PDO API)
      const handleSaveConfigs = async (e) => {
        e.preventDefault();
        const res = await apiRequest('/configs', {
          method: 'PUT',
          body: JSON.stringify(configs)
        });
        if (!res.offline && res.ok && res.data?.status === 'success') {
          if (res.data.configs) setConfigs(res.data.configs);
          showToast(`${res.data.message}`);
          return;
        }
        showToast('Pengaturan threshold berhasil disimpan!');
      };

      // ======================================================================
      // RENDER: SCR-01 LOGIN GATEWAY (STRICT SECURITY CHECK — WAJIB LOGIN DULU)
      // ======================================================================
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between p-4 md:p-8 relative overflow-hidden">
            {/* Ambient Background Glows */}
            <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-red-600/15 blur-[120px] pointer-events-none"></div>
            

            {/* Top Bar Branding */}
            <header className="relative z-10 flex items-center justify-between max-w-6xl mx-auto w-full pb-6 border-b border-slate-800/80">
              <div className="flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-xl bg-red-600 flex items-center justify-center text-white shadow-sm border border-red-500/30">
                  <Icon name="flame" className="w-6 h-6 text-white" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-lg font-semibold tracking-wider text-white font-sans uppercase">TAKASHI</h1>
                    <span className="px-2 py-0.5 bg-red-900/60 text-red-300 border border-red-700/50 rounded text-[10px] font-bold tracking-widest">
                      高橋フライドチキン
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 tracking-wide">Manajemen Inventori & Rantai Dingin QSR</p>
                </div>
              </div>

              <div className="flex items-center gap-2.5 text-xs bg-slate-900/90 border border-slate-800 px-3.5 py-1.5 rounded-full text-slate-300 shadow-xs">
                <span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                <span className="font-semibold text-red-400">Belum Terautentikasi</span>
              </div>
            </header>

            {/* Main Portal Container */}
            <main className="relative z-10 max-w-6xl mx-auto w-full my-6">
              {/* Mandatory Login Warning Banner */}
              <div className="mb-6 p-4 rounded-2xl bg-red-950/40 border border-red-500/30 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-red-600/20 border border-red-500/30 flex items-center justify-center text-red-400 shrink-0">
                    <Icon name="shield" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-xs font-bold text-red-300 font-medium">
                      Portal Keamanan Terproteksi — Wajib Login Terlebih Dahulu
                    </h3>
                    <p className="text-xs text-slate-300 mt-0.5">
                      Seluruh data inventori, telemetry chiller, dan transaksi cabang terkunci. Silakan masukkan kredensial akun Anda untuk membuka akses dasbor.
                    </p>
                  </div>
                </div>
                <span className="px-3 py-1 rounded-md text-[11px] font-medium bg-red-600 text-white shrink-0 shadow-xs">
                  Akses Terkunci
                </span>
              </div>

              {/* Grid 2-Kolom: Form Login (Kiri) & Pilihan Kredensial Demo (Kanan) */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                {/* Form Login (Kiri 5 kolom) */}
                <div className="lg:col-span-5 bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl relative">
                  <div className="mb-6">
                    <div className="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-red-950 text-red-400 border border-red-800/60 text-[10px] font-medium mb-2">
                      <Icon name="user" className="w-3.5 h-3.5" />
                      <span>SCR-01 · Gerbang Otentikasi</span>
                    </div>
                    <h2 className="text-2xl font-semibold text-white tracking-tight">Masuk ke Dasbor</h2>
                    <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                      Masukkan email terdaftar dan kata sandi untuk memverifikasi hak akses Anda.
                    </p>
                  </div>

                  {loginError && (
                    <div className="mb-5 p-3.5 bg-red-950/70 border border-red-800 rounded-xl text-xs text-red-300 flex items-start gap-2.5 shadow-xs">
                      <Icon name="alert" className="w-4 h-4 text-red-400 shrink-0 mt-0.5" />
                      <div>
                        <strong className="block font-bold">Gagal Masuk:</strong>
                        <span>{loginError}</span>
                      </div>
                    </div>
                  )}

                  {autofillHint && (
                    <div className="mb-5 p-3 bg-emerald-950/60 border border-emerald-800/80 rounded-xl text-xs text-emerald-300 flex items-start gap-2.5 shadow-sm">
                      <Icon name="check" className="w-4 h-4 text-emerald-400 shrink-0 mt-0.5" />
                      <span>{autofillHint}</span>
                    </div>
                  )}

                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5">
                        Alamat Email Resmi *
                      </label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                          <Icon name="user" className="w-4 h-4" />
                        </div>
                        <input
                          type="email"
                          value={loginEmail}
                          onChange={(e) => setLoginEmail(e.target.value)}
                          placeholder="contoh: owner@takashi.id"
                          className="w-full bg-slate-950 border border-slate-700/80 rounded-xl pl-10 pr-3.5 py-3 text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-red-500/30 focus:border-red-500 outline-none transition"
                          required
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="block text-xs font-bold text-slate-300">
                          Kata Sandi *
                        </label>
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="text-[11px] text-red-400 hover:text-red-300 font-semibold transition"
                        >
                          {showPassword ? 'Sembunyikan' : 'Lihat Sandi'}
                        </button>
                      </div>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                          <Icon name="shield" className="w-4 h-4" />
                        </div>
                        <input
                          type={showPassword ? 'text' : 'password'}
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          placeholder="Masukkan kata sandi..."
                          className="w-full bg-slate-950 border border-slate-700/80 rounded-xl pl-10 pr-3.5 py-3 text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-red-500/30 focus:border-red-500 outline-none transition"
                          required
                        />
                      </div>
                    </div>

                    <div className="flex items-center justify-between text-xs text-slate-400 py-1">
                      <label className="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" defaultChecked className="rounded bg-slate-950 border-slate-700 text-red-600 focus:ring-red-500 w-4 h-4" />
                        <span>Simpan sesi aktif (sessionStorage)</span>
                      </label>
                    </div>

                    <button
                      type="submit"
                      disabled={isAuthenticating}
                      className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-medium rounded-xl shadow-xs transition-colors flex items-center justify-center gap-2"
                    >
                      {isAuthenticating ? (
                        <>
                          <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                          </svg>
                          <span>Memverifikasi Kredensial...</span>
                        </>
                      ) : (
                        <>
                          <span>Masuk ke Dasbor</span>
                          <Icon name="arrowRight" className="w-4 h-4" />
                        </>
                      )}
                    </button>
                  </form>

                  <div className="mt-6 pt-5 border-t border-slate-800 text-center">
                    <p className="text-[11px] text-slate-500">
                      Takashi OS v1.0 · Enkripsi Sesi RBAC Aktif
                    </p>
                  </div>
                </div>

                {/* Bantuan Kredensial Akun Pengujian (Kanan 7 kolom) */}
                <div className="lg:col-span-7 space-y-4">
                  <div className="bg-slate-900/60 backdrop-blur-md p-7 rounded-3xl border border-slate-800">
                    <div className="flex items-center justify-between mb-3">
                      <div>
                        <span className="text-[10px] font-medium text-slate-400 block">
                          Kredensial Pengujian (4 Peran RBAC)
                        </span>
                        <h3 className="text-lg font-semibold text-white mt-0.5">
                          Pilih akun demo untuk mengisi formulir
                        </h3>
                      </div>
                      <span className="text-xs font-medium text-slate-400 bg-slate-800 px-2.5 py-1 rounded-md border border-slate-700">
                        Password: password
                      </span>
                    </div>

                    <p className="text-xs text-slate-400 mb-5 leading-relaxed">
                      Klik tombol <strong>"Gunakan Kredensial Ini"</strong> pada salah satu profil di bawah untuk memuat email & sandi ke formulir, lalu klik tombol <strong>"Masuk ke Dasbor"</strong> untuk masuk:
                    </p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                      {DEMO_USERS.map(user => (
                        <div
                          key={user.id}
                          className="p-4 rounded-2xl bg-slate-950/70 border border-slate-800 flex flex-col justify-between shadow-sm hover:border-slate-700 transition"
                        >
                          <div>
                            <div className="flex items-center justify-between mb-2">
                              <span className="text-xs font-bold px-2.5 py-0.5 rounded border text-[10px] font-medium bg-slate-900 text-slate-300 border-slate-700">
                                {user.role}
                              </span>
                              <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                            </div>
                            <h4 className="font-semibold text-sm text-white">
                              {user.name}
                            </h4>
                            <p className="text-[11px] text-slate-400 mt-0.5">{user.email}</p>
                            <p className="text-xs text-slate-400 mt-2 line-clamp-2 leading-relaxed">
                              {user.desc}
                            </p>
                          </div>

                          <div className="mt-4 pt-3 border-t border-slate-800/80">
                            <button
                              type="button"
                              onClick={() => handleSelectDemoAccount(user)}
                              className="w-full py-2 px-3 rounded-xl bg-slate-900 hover:bg-red-600 hover:text-white text-slate-300 text-xs font-bold border border-slate-700 hover:border-red-500 transition flex items-center justify-center gap-1.5"
                            >
                              <span>Gunakan Kredensial Ini</span>
                              <Icon name="arrowRight" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Branch Location Badge Matching User's Photo */}
                  <div className="p-4 rounded-2xl bg-slate-900/40 border border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                    <div className="flex items-center gap-2.5">
                      <Icon name="building" className="w-4 h-4 text-amber-400" />
                      <span><strong>Outlet Terdaftar:</strong> DayoDara, Zebra, Lapatta, Ngurah Rai (Palu)</span>
                    </div>
                    <span className="text-emerald-400 font-semibold">4 Cabang Aktif</span>
                  </div>
                </div>
              </div>
            </main>

            {/* Footer */}
            <footer className="relative z-10 max-w-6xl mx-auto w-full pt-4 border-t border-slate-800/80 text-center text-xs text-slate-500 font-mono">
              Takashi Fried Chicken Indonesia © 2026 · Hak Cipta Dilindungi
            </footer>
          </div>
        );
      }

      // ======================================================================
      // RENDER: AUTHENTICATED DASHBOARD (SCR-02 THROUGH SCR-08)
      // ======================================================================
      return (
        <div className="flex h-screen overflow-hidden bg-slate-100/60">
          {/* ================================================================ */}
          {/* SIDEBAR NAVIGATION (LUXURY SUMI DARK #090D16) */}
          {/* ================================================================ */}
          <aside className="w-64 bg-[#090D16] text-slate-200 flex flex-col justify-between border-r border-slate-800/80 z-20 shrink-0 shadow-2xl">
            <div className="overflow-y-auto flex-1">
              {/* Brand Header */}
              <div className="p-4 border-b border-slate-800/80 flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white shadow-sm border border-red-500/30">
                  <Icon name="flame" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="font-semibold text-sm text-white leading-tight">TAKASHI</h1>
                  <p className="text-[11px] text-slate-400 font-mono">Operasional QSR Palu</p>
                </div>
              </div>

              {/* Outlet Selector */}
              <div className="p-3 bg-slate-950/70 border-b border-slate-800/80">
                <label className="text-[11px] font-medium text-slate-400 block mb-1">
                  Pilih Cabang Aktif:
                </label>
                <div className="relative">
                  <select
                    value={selectedOutlet}
                    onChange={(e) => setSelectedOutlet(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700/80 text-xs rounded-lg px-2.5 py-2 text-white focus:ring-1 focus:ring-red-500 outline-none font-sans"
                  >
                    {OUTLETS.map(o => (
                      <option key={o.id} value={o.id}>{o.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="p-3 space-y-1 text-xs">
                <button
                  onClick={() => setCurrentScreen('SCR-02')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-02' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <Icon name="dashboard" className="w-4 h-4" />
                    <span>Executive Cockpit (25)</span>
                  </span>
                  <span className="text-[10px] bg-red-950 text-red-200 px-1.5 py-0.5 rounded font-mono border border-red-800/60">HQ</span>
                </button>

                <button
                  onClick={() => setCurrentScreen('SCR-03')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-03' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <Icon name="package" className="w-4 h-4" />
                    <span>Stok Real-Time Cabang</span>
                  </span>
                  {criticalCount > 0 && (
                    <span className="text-[10px] bg-red-600 text-white font-mono px-1.5 py-0.5 rounded font-medium">
                      {criticalCount}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setCurrentScreen('SCR-04')}
                  className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-04' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <Icon name="receiving" className="w-4 h-4" />
                  <span>Goods Receiving (Stock In)</span>
                </button>

                <button
                  onClick={() => setCurrentScreen('SCR-05')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-05' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <Icon name="kitchen" className="w-4 h-4" />
                    <span>Kitchen Console & Spoilage</span>
                  </span>
                  <span className="text-[10px] bg-amber-500 text-slate-950 font-bold px-1.5 py-0.5 rounded font-mono">90m</span>
                </button>

                <button
                  onClick={() => setCurrentScreen('SCR-06')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-06' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <Icon name="truck" className="w-4 h-4" />
                    <span>Transfer Hub Cabang</span>
                  </span>
                  {pendingHqTransfers > 0 && (
                    <span className="text-[10px] bg-amber-500 text-slate-950 font-mono px-1.5 py-0.5 rounded font-medium">
                      {pendingHqTransfers}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setCurrentScreen('SCR-07')}
                  className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-07' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <Icon name="sensor" className="w-4 h-4" />
                  <span>Batch & TPM Sensor Minyak</span>
                </button>

                <button
                  onClick={() => setCurrentScreen('SCR-09')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-09' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <Icon name="fileText" className="w-4 h-4" />
                    <span>Purchase Order (PO)</span>
                  </span>
                  {pendingPoCount > 0 && (
                    <span className="text-[10px] bg-blue-600 text-white font-mono px-1.5 py-0.5 rounded font-medium">
                      {pendingPoCount}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setCurrentScreen('SCR-10')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-10' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <Icon name="clipboard" className="w-4 h-4" />
                    <span>Stock Opname Formal</span>
                  </span>
                  {opnameAlertCount > 0 && (
                    <span className="text-[10px] bg-red-600 text-white font-mono font-medium px-1.5 py-0.5 rounded">
                      {opnameAlertCount}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setCurrentScreen('SCR-08')}
                  className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-medium transition duration-200 ${
                    currentScreen === 'SCR-08' 
                      ? 'bg-slate-800 text-white font-medium border-l-2 border-red-500 rounded-r-lg rounded-l-none' 
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <Icon name="settings" className="w-4 h-4" />
                  <span>Master Data & Thresholds</span>
                </button>
              </nav>
            </div>

            {/* User Profile & Logout Section */}
            <div className="p-3 border-t border-slate-800/80 bg-slate-950/80 space-y-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5 truncate">
                  <div className="w-8 h-8 rounded-lg bg-red-950/70 border border-red-800/80 flex items-center justify-center text-xs font-mono font-bold text-red-400 shrink-0">
                    {currentUser?.name?.charAt(0) || 'U'}
                  </div>
                  <div className="truncate">
                    <p className="text-xs font-bold text-white truncate leading-tight">{currentUser?.name}</p>
                    <p className="text-[10px] font-mono text-slate-400 truncate">{currentUser?.role}</p>
                  </div>
                </div>
                <span className="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
              </div>

              {/* Logout Button */}
              <button
                onClick={handleLogout}
                className="w-full py-2 bg-slate-900 hover:bg-red-950/70 text-slate-400 hover:text-red-300 border border-slate-800 hover:border-red-800/80 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition"
              >
                <Icon name="logout" className="w-3.5 h-3.5" />
                <span>Keluar (Logout)</span>
              </button>
            </div>
          </aside>

          {/* ================================================================ */}
          {/* MAIN CONTENT WORKSPACE */}
          {/* ================================================================ */}
          <main className="flex-1 flex flex-col overflow-y-auto">
            {/* Top Navigation Bar with Glassmorphism */}
            <header className="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-slate-200/80 px-6 py-3 flex items-center justify-between shadow-card-subtle">
              <div className="flex items-center gap-3">
                <span className="text-xs font-mono font-bold px-2.5 py-1 bg-red-100/80 text-red-800 rounded-md border border-red-200">
                  {currentScreen}
                </span>
                <h2 className="text-base font-semibold text-slate-900 tracking-tight">
                  {currentScreen === 'SCR-02' && 'Cockpit Analitik Eksekutif (25 Charts · 5 Pilar)'}
                  {currentScreen === 'SCR-03' && 'Tabel Stok Real-Time Cabang (FEFO & ABC Class)'}
                  {currentScreen === 'SCR-04' && 'Goods Receiving — Penerimaan Barang & Cold Chain Gate'}
                  {currentScreen === 'SCR-05' && 'Kitchen Console — Pemakaian, Holding Cabinet & Spoilage'}
                  {currentScreen === 'SCR-06' && `Inter-Branch Transfer Hub — Aturan Approval ${formatRp(configs.TRANSFER_HQ_THRESHOLD || 2000000)}`}
                  {currentScreen === 'SCR-07' && 'Batch Inspector, Expiry Heatmap & TPM Sensor Minyak'}
                  {currentScreen === 'SCR-08' && 'Master Data & Pengaturan Threshold Operasional'}
                  {currentScreen === 'SCR-09' && 'Purchase Order (PO) Formal — Pengadaan & Persetujuan HQ'}
                  {currentScreen === 'SCR-10' && 'Stock Opname Formal — Audit Fisik & Toleransi Selisih 3%–5%'}
                </h2>
              </div>

              {/* Status Indicators & Fast Logout */}
              <div className="flex items-center gap-3">
                <div className="hidden xl:flex items-center gap-1.5 text-[11px] font-mono bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-md text-slate-700 font-medium" title="Status Persistensi Database PDO">
                  <Icon name="database" className="w-3.5 h-3.5 text-blue-600" />
                  <span>{persistenceMode}</span>
                </div>
                <div className="hidden md:flex items-center gap-2 text-xs font-mono bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-md text-slate-700 font-medium">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                  <span>Chiller: 2.4°C</span>
                </div>
                <div className="text-xs text-slate-500 font-mono">
                  {liveClock} WITA
                </div>
                <button
                  onClick={handleLogout}
                  className="px-3 py-1 text-xs font-bold text-red-600 hover:bg-red-50 rounded-lg border border-red-200 transition flex items-center gap-1.5"
                  title="Keluar dari sesi"
                >
                  <Icon name="logout" className="w-3.5 h-3.5" />
                  <span>Keluar</span>
                </button>
              </div>
            </header>

            {/* Notification Toast */}
            {toast && (
              <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl text-white text-xs font-bold flex items-center gap-2.5 transition-all ${
                toast.type === 'error' ? 'bg-red-600' : toast.type === 'warning' ? 'bg-amber-600' : 'bg-slate-900'
              }`}>
                <span>{toast.message}</span>
              </div>
            )}

            {/* Dynamic Screen Renderer */}
            <div className="p-6 max-w-7xl w-full mx-auto space-y-6">
              {/* ============================================================ */}
              {/* SCR-02: EXECUTIVE ANALYTICS COCKPIT (ALL 25 CHARTS) */}
              {/* ============================================================ */}
              {currentScreen === 'SCR-02' && (
                <div className="space-y-6">
                  {/* Top KPI Row */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <MetricCard
                      title="Total Nilai Inventori"
                      value={formatRp(totalInventoryValuation)}
                      subtext="FIFO Basis · Multi-Outlet"
                      status="default"
                      iconName="package"
                      sparkline="+12.4%"
                    />
                    <MetricCard
                      title="Stok Kritis (< Safety)"
                      value={`${criticalCount} Item`}
                      subtext="Minyak 15kg & Paha Fillet"
                      status={criticalCount > 0 ? "critical" : "success"}
                      iconName="alert"
                      sparkline="Segera PO"
                    />
                    <MetricCard
                      title="Approval Transfer (≥ Rp 2Jt)"
                      value={`${pendingHqTransfers} Pengajuan`}
                      subtext="Butuh Persetujuan Owner"
                      status={pendingHqTransfers > 0 ? "warning" : "success"}
                      iconName="truck"
                      sparkline="Pending"
                    />
                    <MetricCard
                      title="Rata-rata DSI Ayam"
                      value="1.9 Hari"
                      subtext="Target Mutu: < 2.5 Hari"
                      status="success"
                      iconName="clock"
                      sparkline="Optimal"
                    />
                  </div>

                  {/* 5 Pillars Tabbed Navigation (Segmented Pill Style) */}
                  <div className="bg-white rounded-2xl border border-slate-200/80 p-1.5 shadow-card-subtle flex flex-wrap gap-1.5">
                    {[
                      { id: 1, label: 'Pilar 1: Perencanaan (5)', icon: 'dashboard' },
                      { id: 2, label: 'Pilar 2: Pengadaan (5)', icon: 'receiving' },
                      { id: 3, label: 'Pilar 3: Penyimpanan (5)', icon: 'sensor' },
                      { id: 4, label: 'Pilar 4: Kendali Dapur (5)', icon: 'kitchen' },
                      { id: 5, label: 'Pilar 5: Valuasi (5)', icon: 'package' }
                    ].map(p => (
                      <button
                        key={p.id}
                        onClick={() => setActivePillar(p.id)}
                        className={`px-4 py-2.5 rounded-xl font-bold text-xs transition duration-200 flex items-center gap-2 ${
                          activePillar === p.id 
                            ? 'bg-red-600 text-white shadow-xs' 
                            : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                        }`}
                      >
                        <Icon name={p.icon} className="w-3.5 h-3.5" />
                        <span>{p.label}</span>
                      </button>
                    ))}
                  </div>

                  {/* PILAR 1: PERENCANAAN */}
                  {activePillar === 1 && (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                      <ChartCard id="c1" title="Chart 1: Konsumsi vs Forecast Mingguan" subtitle="Prediksi AI vs Realisasi Penjualan Ayam (Ekor)" footerText="Akurasi model: 96.4%">
                        <div className="flex items-end justify-between h-44 w-full pt-4 px-2">
                          {[
                            { day: 'Sen', f: 180, a: 175 },
                            { day: 'Sel', f: 210, a: 218 },
                            { day: 'Rab', f: 195, a: 190 },
                            { day: 'Kam', f: 230, a: 245 },
                            { day: 'Jum', f: 480, a: 510 },
                            { day: 'Sab', f: 680, a: 695 },
                            { day: 'Min', f: 720, a: 740 }
                          ].map(d => (
                            <div key={d.day} className="flex flex-col items-center gap-1.5">
                              <div className="flex gap-1 items-end h-32">
                                <div style={{ height: `${(d.f / 750) * 100}%` }} className="w-3 bg-slate-300 rounded-t" title={`Forecast: ${d.f}`}></div>
                                <div style={{ height: `${(d.a / 750) * 100}%` }} className="w-3 bg-red-600 rounded-t shadow-xs" title={`Aktual: ${d.a}`}></div>
                              </div>
                              <span className="text-[11px] font-mono text-slate-500 font-semibold">{d.day}</span>
                            </div>
                          ))}
                        </div>
                      </ChartCard>

                      <ChartCard id="c2" title="Chart 2: Safety Stock Alert Radar" subtitle="Posisi Stok Aktual vs Batas Kritis" footerText="2 Item memerlukan PO segera">
                        <div className="space-y-3 pt-2 w-full">
                          {[
                            { name: 'Minyak Padat 15kg', cur: 12, min: 15, pct: 40, status: 'CRITICAL' },
                            { name: 'Paha Fillet Boneless', cur: 32, min: 40, pct: 60, status: 'WARNING' },
                            { name: 'Ayam Karkas Segar', cur: 78, min: 60, pct: 85, status: 'SAFE' },
                            { name: 'Tepung Bumbu 25kg', cur: 18, min: 10, pct: 90, status: 'SAFE' }
                          ].map(i => (
                            <div key={i.name} className="text-xs">
                              <div className="flex justify-between font-mono mb-1 font-semibold">
                                <span className="text-slate-800">{i.name}</span>
                                <span className={i.status === 'CRITICAL' ? 'text-red-600 font-bold' : 'text-slate-600'}>
                                  {i.cur} / min {i.min}
                                </span>
                              </div>
                              <div className="w-full bg-slate-100 rounded-full h-2">
                                <div
                                  className={`h-2 rounded-full transition-all duration-500 ${
                                    i.status === 'CRITICAL' ? 'bg-red-600' : i.status === 'WARNING' ? 'bg-amber-500' : 'bg-emerald-600'
                                  }`}
                                  style={{ width: `${i.pct}%` }}
                                ></div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </ChartCard>

                      <ChartCard id="c3" title="Chart 3: Weekend Surge Multiplier (+350%)" subtitle="Lonjakan Permintaan Jumat–Minggu" footerText="Alokasi stok otomatis aktif">
                        <div className="flex items-center justify-around h-40 pt-4 w-full">
                          <div className="text-center p-3 rounded-xl bg-slate-50 border border-slate-100">
                            <div className="text-2xl font-semibold font-mono text-slate-700">1.0x</div>
                            <div className="text-xs text-slate-500 mt-1 font-medium">Senin–Kamis</div>
                          </div>
                          <Icon name="arrowRight" className="w-5 h-5 text-red-600" />
                          <div className="text-center p-3 rounded-xl bg-red-50 border border-red-200">
                            <div className="text-3xl font-semibold font-mono text-red-600">+350%</div>
                            <div className="text-xs text-red-700 font-bold mt-1">Jumat–Minggu Peak</div>
                          </div>
                        </div>
                      </ChartCard>

                      <ChartCard id="c4" title="Chart 4: Stockout Runway Days" subtitle="Sisa Hari Hingga Stok Habis" footerText="Target fresh runway < 2.5 hari">
                        <div className="space-y-3 pt-2 w-full">
                          {[
                            { name: 'Ayam Karkas', days: 1.8, color: 'bg-emerald-500' },
                            { name: 'Paha Fillet', days: 2.1, color: 'bg-emerald-500' },
                            { name: 'Minyak Padat', days: 3.2, color: 'bg-amber-500' },
                            { name: 'Tepung Bumbu', days: 14.5, color: 'bg-blue-500' }
                          ].map(r => (
                            <div key={r.name} className="flex items-center justify-between text-xs font-mono">
                              <span className="w-28 truncate font-medium text-slate-700">{r.name}</span>
                              <div className="flex-1 mx-3 bg-slate-100 rounded-full h-2">
                                <div className={`h-2 rounded-full ${r.color}`} style={{ width: `${(r.days / 15) * 100}%` }}></div>
                              </div>
                              <span className="font-bold text-slate-900">{r.days} hari</span>
                            </div>
                          ))}
